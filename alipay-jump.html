<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>正在打开小程序…</title>

<!-- 跳转逻辑放在最前面：不等 DOM、不等样式，解析到这里立刻发起 -->
<script>
(function(){
  var APP_ID = '2021003159665300'
  var PAGE   = 'pages/router/main'
  var QUERY  = 'q=https://sh6.co/106940'

  // page 路径部分不编码，只编 ? 之后的页面参数（对齐官方示例）
  function encodePage(p){
    var i = p.indexOf('?')
    return i === -1 ? p : p.slice(0, i + 1) + encodeURIComponent(p.slice(i + 1))
  }

  var scheme = 'alipays://platformapi/startapp'
    + '?appId=' + encodeURIComponent(APP_ID)
    + '&page='  + encodePage(PAGE)
    + '&query=' + encodeURIComponent(QUERY)
  var https_ = 'https://ds.alipay.com/?scheme=' + encodeURIComponent(scheme)

  var ua = navigator.userAgent
  var isAlipay = /AlipayClient/i.test(ua)
  var isWeixin = /MicroMessenger/i.test(ua)
  var isQQ     = /\bQQ\/|QQBrowser/i.test(ua)

  var env = isAlipay ? '支付宝客户端'
          : isWeixin ? '微信内置浏览器'
          : isQQ     ? 'QQ / QQ浏览器'
          :            '普通浏览器'
  var cls = isAlipay ? 'ok' : isWeixin ? 'err' : 'warn'

  // 支付宝内走裸 scheme；其它容器走官方指定的 https 包装
  var target = isAlipay ? scheme : https_
  var how    = isAlipay ? '裸 scheme' : 'https 包装'

  var S = window.__JUMP = {
    scheme: scheme, https: https_, target: target, how: how,
    env: env, cls: cls, ua: ua,
    t0: Date.now(), left: false, err: '', fired: false
  }

  // ===== 关闭中转页：支付宝内置浏览器的 AlipayJSBridge =====
  // 社区口径（非官方文档），拿不到桥就静默跳过，不影响跳转本身
  S.closed = false
  function closeWebview(why){
    if (S.closed) return
    try {
      var b = window.AlipayJSBridge
      if (b && b.call) { b.call('closeWebview'); S.closed = true; S.closeWhy = why }
    } catch (e) { S.closeErr = (e && e.message) ? e.message : String(e) }
  }
  S.closeWebview = closeWebview
  document.addEventListener('AlipayJSBridgeReady', function(){ S.bridgeReady = true }, false)

  // 跳成功（页面进后台）后把中转页关掉，这样从小程序返回时不会退回到这里
  function onLeave(){
    if (S.left) return
    S.left = true
    setTimeout(function(){ closeWebview('jumped') }, 800)
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) onLeave()
    else if (S.left) closeWebview('returned')   // 兜底：真退回来了就立刻关掉
  })
  window.addEventListener('pagehide', onLeave)
  window.addEventListener('blur', onLeave)

  // 立刻跳，不等任何东西
  // 用 replace 而不是 href：不在 webview 历史里留记录
  try {
    location.replace(target)
    S.fired = true
  } catch (e) {
    S.err = (e && e.message) ? e.message : String(e)
    try { location.href = target; S.fired = true } catch (e2) {}
  }
})()
</script>

<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --fg:#1a1c1f; --muted:#6b7280;
    --line:#e5e7eb; --accent:#1677ff; --accent-fg:#fff;
    --ok:#0a8a4a; --warn:#b45309; --err:#c0392b; --code-bg:#f0f2f5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --card:#1f2228; --fg:#e8eaed; --muted:#9aa1ab;
      --line:#2e3238; --accent:#3b82f6; --accent-fg:#fff;
      --ok:#34d399; --warn:#fbbf24; --err:#f87171; --code-bg:#14161a;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 16px 40px;
    background:var(--bg); color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .hero{text-align:center; padding:26px 0 22px}
  .spinner{
    width:38px; height:38px; margin:0 auto 16px;
    border:3px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero h1{font-size:18px; margin:0 0 6px; font-weight:600}
  .hero p{margin:0; color:var(--muted); font-size:13.5px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:12px;
  }
  .card h2{font-size:13px; margin:0 0 10px; color:var(--muted); font-weight:600}
  .kv{display:flex; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--muted); flex:0 0 70px}
  .kv .v{flex:1; word-break:break-all}
  button{
    width:100%; padding:13px; margin-top:9px; font-size:15px; font-weight:600;
    font-family:inherit; border:0; border-radius:9px;
    background:var(--accent); color:var(--accent-fg); cursor:pointer;
  }
  button.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent)}
  button:active{opacity:.75}
  .url{
    display:block; background:var(--code-bg); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; margin:6px 0 0;
    font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    word-break:break-all; white-space:pre-wrap;
  }
  .tag{display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600}
  .tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent); color:var(--ok)}
  .tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent); color:var(--warn)}
  .tag.err{background:color-mix(in srgb,var(--err) 18%,transparent); color:var(--err)}
  #verdict{font-size:14px; font-weight:600; margin:0 0 8px}
  #log{font:11.5px/1.6 ui-monospace,Menlo,monospace; color:var(--muted); white-space:pre-wrap; word-break:break-all; margin:0}
  [hidden]{display:none!important}
</style>
</head>
<body>

<div class="hero">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">正在打开支付宝小程序…</h1>
  <p id="subtitle">如果没有自动跳转，请点下面的按钮</p>
</div>

<div class="card" id="fallback" hidden>
  <h2>手动重试</h2>
  <button id="goScheme">用裸 scheme 跳转</button>
  <button class="ghost" id="goHttps">用 https 包装跳转</button>
</div>

<div class="card">
  <h2>跳转目标（已写死）</h2>
  <div class="kv"><span class="k">appId</span><span class="v">2021003159665300</span></div>
  <div class="kv"><span class="k">page</span><span class="v">pages/router/main</span></div>
  <div class="kv"><span class="k">q</span><span class="v">https://sh6.co/106940</span></div>
</div>

<div class="card">
  <h2>环境</h2>
  <div class="kv"><span class="k">容器</span><span class="v" id="env">—</span></div>
  <div class="kv"><span class="k">跳转方式</span><span class="v" id="how">—</span></div>
  <div class="kv"><span class="k">发起耗时</span><span class="v" id="t0">—</span></div>
  <div class="kv"><span class="k">UA</span><span class="v" id="ua">—</span></div>
</div>

<div class="card">
  <h2>结果</h2>
  <p id="verdict">—</p>
  <p id="log"></p>
</div>

<div class="card">
  <h2>实际拼出的链接</h2>
  <div class="url" id="urlScheme">—</div>
  <div class="url" id="urlHttps">—</div>
</div>

<script>
(function(){
  var S = window.__JUMP
  var $ = function(id){ return document.getElementById(id) }
  var lines = []
  function log(msg){
    lines.unshift('[' + new Date().toTimeString().slice(0,8) + '] ' + msg)
    $('log').textContent = lines.slice(0,20).join('\n')
  }

  $('env').innerHTML   = '<span class="tag ' + S.cls + '">' + S.env + '</span>'
  $('how').textContent = S.how + '（在 <head> 里立即发起，无延迟）'
  $('t0').textContent  = (Date.now() - S.t0) + ' ms 前已发起'
  $('ua').textContent  = S.ua
  $('urlScheme').textContent = S.scheme
  $('urlHttps').textContent  = S.https

  log('环境：' + S.env)
  log('跳转方式：' + S.how)
  log(S.fired ? '→ 已在 <head> 阶段发起跳转（0 延迟，location.replace）' : '✗ 发起失败')
  if (S.err) log('✗ 抛异常：' + S.err)

  function jump(url, label){
    log('→ 尝试 ' + label)
    try { location.replace(url) }
    catch (e) { log('✗ 抛异常：' + (e && e.message ? e.message : String(e))) }
  }
  $('goScheme').addEventListener('click', function(){ jump(S.scheme, '裸 scheme（手动）') })
  $('goHttps').addEventListener('click',  function(){ jump(S.https,  'https 包装（手动）') })

  function settle(){
    $('spinner').hidden = true
    if (S.left) {
      $('title').textContent = '已唤起小程序'
      $('subtitle').textContent = '如果没看到小程序，说明是唤起后又被退回'
      $('verdict').innerHTML = '<span class="tag ok">✓ 页面切到后台 —— 跳转成功</span>'
      log('✓ 检测到页面离开前台，判定唤起成功')
      log(S.closed ? ('✓ 已调用 closeWebview 关闭中转页（' + S.closeWhy + '）')
                   : ('✗ 未能关闭中转页｜桥就绪=' + !!S.bridgeReady + ' 桥存在=' + !!window.AlipayJSBridge))
    } else {
      $('title').textContent = '没有跳转成功'
      $('subtitle').textContent = '可以用下面的按钮手动再试一次'
      $('verdict').innerHTML = '<span class="tag err">✗ 页面没离开前台 —— 被拦截或 scheme 无效</span>'
      log('✗ 2.5s 内页面仍在前台，判定失败')
      $('fallback').hidden = false
    }
  }
  // 从 head 发起那一刻起算 2.5s
  setTimeout(settle, Math.max(300, 2500 - (Date.now() - S.t0)))
})()
</script>
</body>
</html>

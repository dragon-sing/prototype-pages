<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>正在打开小程序…</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --fg:#1a1c1f; --muted:#6b7280;
    --line:#e5e7eb; --accent:#1677ff; --accent-fg:#fff;
    --ok:#0a8a4a; --warn:#b45309; --err:#c0392b; --code-bg:#f0f2f5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --card:#1f2228; --fg:#e8eaed; --muted:#9aa1ab;
      --line:#2e3238; --accent:#3b82f6; --accent-fg:#fff;
      --ok:#34d399; --warn:#fbbf24; --err:#f87171; --code-bg:#14161a;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 16px 40px;
    background:var(--bg); color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .hero{text-align:center; padding:26px 0 22px}
  .spinner{
    width:38px; height:38px; margin:0 auto 16px;
    border:3px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero h1{font-size:18px; margin:0 0 6px; font-weight:600}
  .hero p{margin:0; color:var(--muted); font-size:13.5px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:12px;
  }
  .card h2{font-size:13px; margin:0 0 10px; color:var(--muted); font-weight:600}
  .kv{display:flex; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--muted); flex:0 0 70px}
  .kv .v{flex:1; word-break:break-all}
  button{
    width:100%; padding:13px; margin-top:9px; font-size:15px; font-weight:600;
    font-family:inherit; border:0; border-radius:9px;
    background:var(--accent); color:var(--accent-fg); cursor:pointer;
  }
  button.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent)}
  button:active{opacity:.75}
  .url{
    display:block; background:var(--code-bg); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; margin:6px 0 0;
    font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    word-break:break-all; white-space:pre-wrap;
  }
  .tag{display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600}
  .tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent); color:var(--ok)}
  .tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent); color:var(--warn)}
  .tag.err{background:color-mix(in srgb,var(--err) 18%,transparent); color:var(--err)}
  #verdict{font-size:14px; font-weight:600; margin:0 0 8px}
  #log{font:11.5px/1.6 ui-monospace,Menlo,monospace; color:var(--muted); white-space:pre-wrap; word-break:break-all; margin:0}
  [hidden]{display:none!important}
</style>
</head>
<body>

<div class="hero">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">正在打开支付宝小程序…</h1>
  <p id="subtitle">如果没有自动跳转，请点下面的按钮</p>
</div>

<div class="card" id="fallback" hidden>
  <h2>手动重试</h2>
  <button id="goScheme">用裸 scheme 跳转</button>
  <button class="ghost" id="goHttps">用 https 包装跳转</button>
</div>

<div class="card">
  <h2>跳转目标（已写死）</h2>
  <div class="kv"><span class="k">appId</span><span class="v">2021003159665300</span></div>
  <div class="kv"><span class="k">page</span><span class="v">pages/router/main</span></div>
  <div class="kv"><span class="k">q</span><span class="v">https://sh6.co/106940</span></div>
</div>

<div class="card">
  <h2>环境</h2>
  <div class="kv"><span class="k">容器</span><span class="v" id="env">—</span></div>
  <div class="kv"><span class="k">UA</span><span class="v" id="ua">—</span></div>
</div>

<div class="card">
  <h2>结果</h2>
  <p id="verdict">—</p>
  <p id="log"></p>
</div>

<div class="card">
  <h2>实际拼出的链接</h2>
  <div class="url" id="urlScheme">—</div>
  <div class="url" id="urlHttps">—</div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id) }
  var lines = []
  function log(msg){
    lines.unshift('[' + new Date().toTimeString().slice(0,8) + '] ' + msg)
    $('log').textContent = lines.slice(0,20).join('\n')
  }

  // ===== 写死的跳转目标 =====
  var APP_ID = '2021003159665300'
  var PAGE   = 'pages/router/main'
  var QUERY  = 'q=https://sh6.co/106940'

  // page 路径部分不编码，只编 ? 之后的页面参数（对齐官方示例）
  function encodePage(p){
    var i = p.indexOf('?')
    return i === -1 ? p : p.slice(0, i + 1) + encodeURIComponent(p.slice(i + 1))
  }

  var schemeUrl = 'alipays://platformapi/startapp'
    + '?appId=' + encodeURIComponent(APP_ID)
    + '&page='  + encodePage(PAGE)
    + '&query=' + encodeURIComponent(QUERY)
  var httpsUrl = 'https://ds.alipay.com/?scheme=' + encodeURIComponent(schemeUrl)

  $('urlScheme').textContent = schemeUrl
  $('urlHttps').textContent  = httpsUrl

  // ===== 环境判定 =====
  var ua = navigator.userAgent
  var isAlipay = /AlipayClient/i.test(ua)
  var isWeixin = /MicroMessenger/i.test(ua)
  var isQQ     = /\bQQ\/|QQBrowser/i.test(ua)

  var envName, envClass
  if (isAlipay)      { envName = '支付宝客户端';   envClass = 'ok'   }
  else if (isWeixin) { envName = '微信内置浏览器'; envClass = 'err'  }
  else if (isQQ)     { envName = 'QQ / QQ浏览器';  envClass = 'warn' }
  else               { envName = '普通浏览器';     envClass = 'warn' }

  $('env').innerHTML = '<span class="tag ' + envClass + '">' + envName + '</span>'
  $('ua').textContent = ua

  // 支付宝内用裸 scheme；其它容器用官方指定的 https 包装
  var primaryUrl   = isAlipay ? schemeUrl : httpsUrl
  var primaryLabel = isAlipay ? '裸 scheme' : 'https 包装'

  // ===== 跳转 + 成功判定 =====
  var left = false
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) left = true
  })
  window.addEventListener('pagehide', function(){ left = true })

  function jump(url, label){
    log('→ 尝试 ' + label)
    try { location.href = url }
    catch (e) { log('✗ 抛异常：' + (e && e.message ? e.message : String(e))) }
  }

  function settle(){
    $('spinner').hidden = true
    if (left) {
      $('title').textContent = '已唤起小程序'
      $('subtitle').textContent = '如果没看到小程序，说明是唤起后又被退回'
      $('verdict').innerHTML = '<span class="tag ok">✓ 页面切到后台 —— 跳转成功</span>'
      log('✓ 检测到页面离开前台，判定唤起成功')
    } else {
      $('title').textContent = '没有跳转成功'
      $('subtitle').textContent = '可以用下面的按钮手动再试一次'
      $('verdict').innerHTML = '<span class="tag err">✗ 页面没离开前台 —— 被拦截或 scheme 无效</span>'
      log('✗ 2.5s 内页面仍在前台，判定失败')
      $('fallback').hidden = false
    }
  }

  $('goScheme').addEventListener('click', function(){ jump(schemeUrl, '裸 scheme（手动）') })
  $('goHttps').addEventListener('click',  function(){ jump(httpsUrl,  'https 包装（手动）') })

  log('环境：' + envName)
  log('自动跳转方式：' + primaryLabel)

  // 留一点时间让首屏画出来，再自动跳
  setTimeout(function(){
    jump(primaryUrl, primaryLabel + '（自动）')
    setTimeout(settle, 2500)
  }, 400)
})()
</script>
</body>
</html>
